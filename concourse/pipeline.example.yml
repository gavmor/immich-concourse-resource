resource_types:
  - name: immich-api
    type: registry-image
    source:
      repository: ghcr.io/gavmor/immich-concourse-resource
      # Pin to a released version tag (e.g. "1.2.0", published by CI on
      # every `vX.Y.Z` git tag -- see README.md "CI"), not `latest`,
      # so a new release can't silently change pipeline behavior.
      tag: ((immich_resource_version))

resources:
  - name: git-repo
    type: git
    source:
      uri: https://github.com/gavmor/example-render-repo
      branch: main

  # Declare the custom Immich resource type.
  - name: local-immich-gallery
    type: immich-api
    source:
      host: ((immich_local_url)) # e.g. http://192.168.16.1:2283
      api_key: ((immich_api_key))

jobs:
  - name: process-and-sample-portraits
    # Serialize this job (or use a lock/resource-pool) whenever `album`
    # names a value that might not exist yet -- see README.md "Known
    # limitations: album-name race condition". Immich has no atomic
    # get-or-create for albums (unlike tags), so two builds racing to
    # create the same new album name can create duplicates.
    serial: true
    plan:
      - get: git-repo
        trigger: true

      # ... render, alter, and quality-gate tasks that populate
      # modified-assets/*.png in the working directory ...

      # Pure declarative egress: pushes the final portraits to Immich,
      # auto-binding any matching .xmp sidecar files, and provisioning
      # both the album and custom tags on the fly.
      - put: local-immich-gallery
        no_get: true # put-only resource; there's nothing to fetch back
        params:
          glob: "modified-assets/*.png"
          is_favorite: true
          visibility: "timeline"
          album: "Render Output"
          tags:
            - "concourse"
            - "nightly-render"
